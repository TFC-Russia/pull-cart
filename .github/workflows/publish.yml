name: Publish

# Builds the jar of the commit a release points at, attaches it to that release,
# and sends it on to CurseForge and Modrinth. scripts/release.sh creates the
# release, so a release is one command: script -> release -> this.
#
# The jar reaches the GitHub release either way. Uploading to the mod sites waits
# until the mod has pages: set curseforge_id and modrinth_id in gradle.properties
# and add CURSEFORGE_TOKEN and MODRINTH_TOKEN as repository secrets. With neither
# id set the job still builds, attaches the jar, says nothing else is configured
# and stops green.
#
# Note that a release created by a workflow with GITHUB_TOKEN would not start this
# one: GitHub does not fire workflows on events its own token caused. That is why
# the release comes from the script, under your account, and not from CI.
#
# Run it by hand (Actions > Publish > Run workflow) to only build the jar.
#
# The same file serves both game lines: the versions, the loader and the JDK all
# come from the branch being built.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the build properties
        id: props
        run: |
          prop() { grep -E "^$1=" gradle.properties | cut -d= -f2- | tr -d '\r'; }
          mod_version=$(prop mod_version)
          {
            echo "mod_id=$(prop mod_id)"
            echo "mod_name=$(prop mod_name)"
            echo "mod_version=$mod_version"
            echo "minecraft_version=$(prop minecraft_version)"
            echo "curseforge_id=$(prop curseforge_id)"
            echo "modrinth_id=$(prop modrinth_id)"
            # A branch that names a NeoForge version builds on NeoForge, the rest on Forge
            if [ -n "$(prop neo_version)" ]; then echo "loader=neoforge"; else echo "loader=forge"; fi
            # The Java version the build itself asks for; .jabbarc is the fallback
            java=$(grep -oE 'JavaLanguageVersion\.of\([0-9]+\)' build.gradle | grep -oE '[0-9]+' | head -1)
            if [ -z "$java" ] && [ -f .jabbarc ]; then
              java=$(tr -d '\r' < .jabbarc | sed -E 's/^.*@([0-9]+).*$/\1/')
            fi
            echo "java=$java"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

          # A release tag names the version it ships, it does not set it
          if [ "$GITHUB_EVENT_NAME" = release ] && [ "$GITHUB_REF_NAME" != "v$mod_version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match mod_version $mod_version, expected v$mod_version"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.props.outputs.java }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.props.outputs.mod_id }}-${{ steps.props.outputs.mod_version }}
          path: build/libs/${{ steps.props.outputs.mod_id }}-*.jar

      # The jar belongs on the release whether or not the mod has pages anywhere,
      # so this does not wait on the ids the way the step below does
      - name: Attach the jar to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          MOD_ID: ${{ steps.props.outputs.mod_id }}
        run: gh release upload "$GITHUB_REF_NAME" build/libs/"$MOD_ID"-*.jar --clobber

      - name: Say that nothing is configured to publish to
        if: github.event_name == 'release' && steps.props.outputs.curseforge_id == '' && steps.props.outputs.modrinth_id == ''
        run: |
          echo "::notice::No curseforge_id or modrinth_id in gradle.properties, so the jar went to the GitHub release and nowhere else."

      - name: Upload to CurseForge and Modrinth
        if: github.event_name == 'release' && (steps.props.outputs.curseforge_id != '' || steps.props.outputs.modrinth_id != '')
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          curseforge-id: ${{ steps.props.outputs.curseforge_id }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: ${{ steps.props.outputs.modrinth_id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          # No github-token on purpose: the step above owns the release asset, and
          # letting both attach the same file is how you get a duplicate or a clash
          files: build/libs/${{ steps.props.outputs.mod_id }}-*.jar
          name: ${{ steps.props.outputs.mod_name }} ${{ steps.props.outputs.mod_version }}
          version: ${{ steps.props.outputs.mod_version }}
          version-type: ${{ github.event.release.prerelease && 'beta' || 'release' }}
          changelog: ${{ github.event.release.body }}
          loaders: ${{ steps.props.outputs.loader }}
          game-versions: ${{ steps.props.outputs.minecraft_version }}
          java: ${{ steps.props.outputs.java }}
          # Dependencies are named per site, so a mod that needs others says so here.
          # Use slugs, not numeric project ids: mc-publish looks an id up through the
          # CurseForge Core API and drops the dependency without a word when that
          # lookup fails, which is what happened to TerraFirmaCraft in another mod here.
          # dependencies: |
          #   tfc(required){curseforge:terrafirmacraft}{modrinth:terrafirmacraft}
          #   curios(required){curseforge:curios}{modrinth:curios}
